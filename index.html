<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TER - Ligne fictive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="jeu">

        <!-- =========================
             DÉCOR DE LA LIGNE
        ========================== -->

        <img
            id="fond"
            src="images/fichier_00000000277081f4a01371aaece18d71.png"
            alt="Décor de la ligne"
        >


        <!-- =========================
             RAME AGC
        ========================== -->

        <img
            id="rame"
            src="images/AGC-R.HDF.png"
            alt="Rame AGC Hauts-de-France"
        >


        <!-- =========================
             INFORMATIONS
        ========================== -->

        <div id="interface">

            <div class="indicateur">
                <span>Distance</span>

                <strong id="distance">
                    0 m
                </strong>
            </div>


            <div class="indicateur">
                <span>Vitesse</span>

                <strong id="vitesse">
                    0 km/h
                </strong>
            </div>

        </div>


        <!-- =========================
             COMMANDES
        ========================== -->

        <div id="commandes">

            <button id="frein">
                FREIN
            </button>

            <button id="urgence">
                FU
            </button>

            <input
                id="accelerateur"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <span>
                Accélérateur
            </span>

        </div>

    </main>


    <!-- PROGRAMME DU JEU -->

    <script src="game.js"></script>

</
